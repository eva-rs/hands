[package]
name = "eva-hands"
version = "0.1.0"
edition = "2024"
description = "Eva's hands on a working machine: file operations and commands over a framed protocol carried by SSH"

[lib]
name = "eva_hands"
path = "src/lib.rs"

[[bin]]
name = "eva-hands"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = ["bin"]
# Всё, что нужно только исполняемому файлу: разбор аргументов, конфига и логи.
# Ядро подключает библиотеку без этого — clap и env_logger ему не нужны.
bin = ["dep:clap", "dep:env_logger", "dep:toml"]

[dependencies]
tokio = { version = "1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
log = "0.4"

clap = { version = "4", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
toml = { version = "0.8", optional = true }
