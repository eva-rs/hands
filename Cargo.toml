[package]
name = "eva-hands"
version = "0.1.0"
edition = "2024"
description = "Eva's hands: file and process operations, in-process or over an encrypted channel"

[lib]
path = "src/lib.rs"

[[bin]]
name = "eva-hands"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = ["bin"]
bin = ["dep:clap", "dep:base64", "eva/cli", "eva/tokio"]

[dependencies]
eva = { git = "https://git.desu.church/VienDesu/eva.git" }
eyre = "0.6"

tokio = { version = "1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }

snow = "0.10"
secrecy = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# Same pin as eva, so the JsonSchema trait unifies with `#[eva::data]` consumers.
schemars = { version = "=1.0.0-alpha.17", default-features = false, features = ["std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2"
log = { version = "0.4", features = ["kv"] }

clap = { version = "4", features = ["derive"], optional = true }
base64 = { version = "0.22", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
